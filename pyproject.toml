[project]
name = "tire-inspection-pipeline"
version = "0.1.0"
description = "Automated multi-image tire inspection pipeline with mirror correction, multi-model VLM extraction, and deterministic merging."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "pillow>=10.4.0",
    "opencv-python-headless>=4.10.0.84",
    "pytesseract>=0.3.13",
    "numpy>=1.26.4",
    "huggingface_hub>=0.26.0",
    "requests>=2.32.3",
    "streamlit>=1.39.0",
    "pydantic>=2.9.0",
    "google-genai>=2.12.1",
]

[tool.uv]
package = false
